[package]
name = "stellar_wrap_contract"
version = "0.1.0"
edition = "2021"
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "=27.0.3"

[dev-dependencies]
soroban-sdk = { version = "=27.0.3", features = ["testutils"] }
proptest = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
