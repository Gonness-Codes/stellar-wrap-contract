[Package]
name = "stellar_wrap_contract"
version = "0.1.0"
edition = "2021"
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "=27.0.3"
# In-guest ed25519 verification. WASM sizes (rustc 1.76.0): in-guest 186k, host 102k.
# Decision: keep in-guest for error semantics; see SIGNATURE_VERIFICATION_DECISION.md.
# Size tracked by CI; pin =3.0.0 to unify with soroban-env-host.
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "=27.0.3", features = ["testutils"] }
proptest = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1