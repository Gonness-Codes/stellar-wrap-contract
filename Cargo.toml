# ed25519 in-guest: 82432B vs host 44576B; kept for error semantics; pin =3.0.0
[package]
name="stellar_wrap_contract"
version="0.1.0"
edition="2021"
resolver="2"
[lib]
crate-type=["cdylib", "rlib"]
path="src/lib.rs"
[features]
default=["in-guest-verification"]
testutils=["soroban-sdk/testutils"]
in-guest-verification=["dep:ed25519-dalek"]
[dependencies]
soroban-sdk="=27.0.3"
ed25519-dalek={version="=3.0.0", optional=true}
[dev-dependencies]
soroban-sdk={version="=27.0.3", features=["testutils"]}
proptest={version="1", default-features=false, features=["alloc"]}
[profile.release]
opt-level="z"
lto=true
panic="abort"
codegen-units=1
