name: Cargo Clippy
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo clippy --all-targets - -D warnings && cargo build --release --target wasm32-unknown-unknown && LIMIT=$(cat .github/wasm-size-limit) && SIZE=$(find target/wasm32-unknown-unknown/release -name '*.wasm' -printf '%s\n' | sort -n | tail -1) && test "$SIZE" -le "$LIMIT"
